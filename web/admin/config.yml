backend:
  name: github
  repo: ghiridhars/intelligent-pwa-library
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  client_id: YOUR_GITHUB_OAUTH_CLIENT_ID

media_folder: raw_assets
public_folder: raw_assets

site_url: https://ghiridhars.github.io/intelligent-pwa-library

display_url: https://ghiridhars.github.io/intelligent-pwa-library

collections:
  - name: catalog
    label: Book Catalog
    delete: false
    files:
      - name: catalog
        label: catalog.json
        file: data/catalog.json
        format: json
        editor:
          preview: false
        fields:
          - name: books
            label: Books
            widget: list
            summary: "{{fields.title}} ({{fields.primary_language}})"
            fields:
              - { name: book_id, label: Book ID, widget: string }
              - { name: title, label: Title, widget: string }
              - name: primary_language
                label: Primary Language
                widget: select
                options:
                  - { label: Malayalam, value: ml }
                  - { label: Tamil, value: ta }
                  - { label: Hindi, value: hi }
                  - { label: Sanskrit, value: sa }
              - name: languages
                label: All Languages in Book
                widget: select
                multiple: true
                options:
                  - { label: Malayalam, value: ml }
                  - { label: Tamil, value: ta }
                  - { label: Hindi, value: hi }
                  - { label: Sanskrit, value: sa }
              - name: script
                label: Script
                widget: select
                options:
                  - { label: Malayalam, value: malayalam }
                  - { label: Tamil, value: tamil }
                  - { label: Devanagari (Hindi/Sanskrit), value: devanagari }
              - name: type
                label: Type
                widget: select
                default: pdf
                options:
                  - { label: PDF, value: pdf }
              - name: index_file
                label: Index File Path
                widget: string
                hint: "e.g. data/indices/bhajanamritam_01.json"
              - name: asset_url
                label: PDF Path
                widget: string
                hint: "e.g. raw_assets/bhajanamritam_01.pdf (PDF must be added via git)"
              - name: page_count
                label: Page Count
                widget: number
