<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Admin</title>
</head>
<body>
  <!--
    Decap CMS admin panel.

    One-time setup:
      1. Create a GitHub OAuth App at https://github.com/settings/developers
         - Homepage URL: https://username.github.io/library-manager
         - Callback URL:  https://api.netlify.com/auth/done
      2. Replace the placeholder values below with your actual
         GitHub username, repository name, and OAuth App client_id.
  -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "username/library-manager",       // ← replace with your repo
          branch: "main",
          base_url: "https://api.netlify.com",    // Netlify OAuth proxy
          auth_endpoint: "auth",
          client_id: "YOUR_GITHUB_OAUTH_CLIENT_ID" // ← replace
        },
        media_folder: "raw_assets",
        public_folder: "raw_assets",
        collections: [
          {
            name: "catalog",
            label: "Book Catalog",
            files: [
              {
                name: "catalog",
                label: "catalog.json",
                file: "data/catalog.json",
                // Catalog is a JSON array — each item is one book entry.
                fields: [
                  {
                    name: "books",
                    label: "Books",
                    widget: "list",
                    fields: [
                      { name: "book_id",         label: "Book ID",          widget: "string" },
                      { name: "title",            label: "Title",            widget: "string" },
                      {
                        name: "primary_language",
                        label: "Primary Language",
                        widget: "select",
                        options: [
                          { label: "Malayalam", value: "ml" },
                          { label: "Tamil",     value: "ta" },
                          { label: "Hindi",     value: "hi" },
                          { label: "Sanskrit",  value: "sa" }
                        ]
                      },
                      {
                        name: "languages",
                        label: "All Languages in Book",
                        widget: "select",
                        multiple: true,
                        options: [
                          { label: "Malayalam", value: "ml" },
                          { label: "Tamil",     value: "ta" },
                          { label: "Hindi",     value: "hi" },
                          { label: "Sanskrit",  value: "sa" }
                        ]
                      },
                      {
                        name: "script",
                        label: "Script",
                        widget: "select",
                        options: [
                          { label: "Malayalam", value: "malayalam" },
                          { label: "Tamil",     value: "tamil" },
                          { label: "Devanagari (Hindi/Sanskrit)", value: "devanagari" }
                        ]
                      },
                      {
                        name: "type",
                        label: "Type",
                        widget: "select",
                        default: "pdf",
                        options: [{ label: "PDF", value: "pdf" }]
                      },
                      { name: "index_file",  label: "Index File Path",  widget: "string",
                        hint: "e.g. data/indices/bhajanamritam_01.json" },
                      { name: "asset_url",   label: "PDF Path",         widget: "string",
                        hint: "e.g. raw_assets/bhajanamritam_01.pdf — add the PDF via git, not this form" },
                      { name: "page_count",  label: "Page Count",       widget: "number" }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
