name: Build Index & Deploy

on:
  push:
    branches: [main]

# Only one deploy can run at a time to prevent race conditions on gh-pages
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 for change detection

      # ── 2. Detect changed PDFs ──────────────────────────────────────────────
      - name: Detect changed PDFs
        id: changed_pdfs
        run: |
          # List PDF files changed in this push (vs previous commit)
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'raw_assets/*.pdf' || true)
          echo "changed_pdfs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "No PDF changes detected — skipping OCR step."
          else
            echo "Changed PDFs:"
            echo "$CHANGED"
          fi

      # ── 3. OCR: only run if PDFs changed ────────────────────────────────────
      - name: Install Tesseract + language packs
        if: steps.changed_pdfs.outputs.changed_pdfs != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-mal \
            tesseract-ocr-tam \
            tesseract-ocr-hin \
            tesseract-ocr-san \
            libtesseract-dev

      - name: Set up Python
        if: steps.changed_pdfs.outputs.changed_pdfs != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        if: steps.changed_pdfs.outputs.changed_pdfs != ''
        run: pip install -r scripts/requirements.txt

      - name: Run OCR on changed PDFs
        if: steps.changed_pdfs.outputs.changed_pdfs != ''
        run: |
          # For each changed PDF, look up its entry in catalog.json and run ingest.py
          python - <<'PYEOF'
          import json, subprocess, sys
          with open("data/catalog.json", encoding="utf-8") as f:
              decoded = json.load(f)

          if isinstance(decoded, list):
              catalog = decoded
          elif isinstance(decoded, dict) and isinstance(decoded.get("books"), list):
              catalog = decoded["books"]
          else:
              print("ERROR: Invalid data/catalog.json format. Expected list or {\"books\": [...]}", file=sys.stderr)
              sys.exit(1)

          # Build a map of asset_url -> catalog entry
          asset_map = {entry["asset_url"]: entry for entry in catalog}

          changed = """${{ steps.changed_pdfs.outputs.changed_pdfs }}""".strip().splitlines()

          # Tesseract pack name comes from the primary_language code
          lang_to_pack = {"ml": "mal", "ta": "tam", "hi": "hin", "sa": "san"}

          for pdf_path in changed:
              pdf_path = pdf_path.strip()
              if not pdf_path or not pdf_path.endswith(".pdf"):
                  continue
              entry = asset_map.get(pdf_path)
              if not entry:
                  print(f"WARNING: {pdf_path} not in catalog.json — skipping.", file=sys.stderr)
                  continue
              lang_code = entry["primary_language"]
              tess_lang = lang_to_pack.get(lang_code, "mal")
              cmd = [
                  "python", "scripts/ingest.py",
                  "--book-id",  entry["book_id"],
                  "--pdf",      pdf_path,
                  "--lang",     tess_lang,
                  "--output",   entry["index_file"],
              ]
              print(f"Running: {' '.join(cmd)}")
              result = subprocess.run(cmd)
              if result.returncode != 0:
                  print(f"ERROR: ingest.py failed for {pdf_path}", file=sys.stderr)
                  sys.exit(1)
          PYEOF

              - name: Validate catalog assets and index integrity
              run: |
                mkdir -p reports
                python3 - <<'PYEOF'
                import json
                import os
                import re
                import sys
                from collections import Counter

                with open("data/catalog.json", encoding="utf-8") as f:
                  decoded = json.load(f)

                if isinstance(decoded, list):
                  catalog = decoded
                elif isinstance(decoded, dict) and isinstance(decoded.get("books"), list):
                  catalog = decoded["books"]
                else:
                  print("ERROR: Invalid data/catalog.json format. Expected list or {\"books\": [...]}.", file=sys.stderr)
                  sys.exit(1)

                changed_pdf_lines = """${{ steps.changed_pdfs.outputs.changed_pdfs }}""".strip().splitlines()
                changed_pdfs = {line.strip() for line in changed_pdf_lines if line.strip()}

                errors = []
                quality_failures = []
                report_books = []

                for entry in catalog:
                  book_id = str(entry.get("book_id", "")).strip()
                  asset_url = str(entry.get("asset_url", "")).strip()
                  index_file = str(entry.get("index_file", "")).strip()

                  if not book_id:
                    errors.append("catalog entry missing book_id")
                    continue

                  if not asset_url:
                    errors.append(f"{book_id}: missing asset_url")
                  elif not os.path.isfile(asset_url):
                    errors.append(f"{book_id}: asset file not found at {asset_url}")

                  if not index_file:
                    errors.append(f"{book_id}: missing index_file")
                  elif not os.path.isfile(index_file):
                    errors.append(f"{book_id}: index file not found at {index_file}")

                  # OCR quality checks are enforced for books whose PDFs changed in this push.
                  if asset_url not in changed_pdfs:
                    continue

                  metrics = {
                    "book_id": book_id,
                    "asset_url": asset_url,
                    "index_file": index_file,
                    "entries": 0,
                    "empty_title_native": 0,
                    "duplicate_page_numbers": 0,
                    "numeric_only_titles": 0,
                    "short_titles_len_le_2": 0,
                    "quality_status": "ok",
                    "issues": [],
                  }

                  if not index_file or not os.path.isfile(index_file):
                    metrics["quality_status"] = "failed"
                    metrics["issues"].append("missing_index_file")
                    quality_failures.append(f"{book_id}: index file missing after OCR")
                    report_books.append(metrics)
                    continue

                  with open(index_file, encoding="utf-8") as f:
                    index_data = json.load(f)

                  if not isinstance(index_data, list):
                    metrics["quality_status"] = "failed"
                    metrics["issues"].append("index_not_array")
                    quality_failures.append(f"{book_id}: index file must contain a JSON array")
                    report_books.append(metrics)
                    continue

                  metrics["entries"] = len(index_data)
                  if metrics["entries"] == 0:
                    metrics["quality_status"] = "failed"
                    metrics["issues"].append("empty_index")
                    quality_failures.append(f"{book_id}: OCR produced zero entries")

                  page_numbers = []
                  for row in index_data:
                    if not isinstance(row, dict):
                      continue

                    title_native = str(row.get("title_native", "")).strip()
                    if not title_native:
                      metrics["empty_title_native"] += 1
                    else:
                      if len(title_native) <= 2:
                        metrics["short_titles_len_le_2"] += 1
                      if re.fullmatch(r"[0-9\s\-.,()]+", title_native):
                        metrics["numeric_only_titles"] += 1

                    page = row.get("page_number")
                    if isinstance(page, int):
                      page_numbers.append(page)

                  page_counts = Counter(page_numbers)
                  duplicate_pages = [p for p, c in page_counts.items() if c > 1]
                  metrics["duplicate_page_numbers"] = len(duplicate_pages)

                  if metrics["duplicate_page_numbers"] > 0:
                    metrics["quality_status"] = "failed"
                    metrics["issues"].append("duplicate_page_numbers")
                    quality_failures.append(
                      f"{book_id}: duplicate page_number values found ({metrics['duplicate_page_numbers']})"
                    )

                  if metrics["empty_title_native"] > 0:
                    metrics["quality_status"] = "failed"
                    metrics["issues"].append("empty_title_native")
                    quality_failures.append(
                      f"{book_id}: empty title_native entries found ({metrics['empty_title_native']})"
                    )

                  report_books.append(metrics)

                report = {
                  "changed_pdfs": sorted(changed_pdfs),
                  "checked_books": report_books,
                  "summary": {
                    "catalog_entries": len(catalog),
                    "changed_pdf_count": len(changed_pdfs),
                    "quality_checked_books": len(report_books),
                    "error_count": len(errors),
                    "quality_failure_count": len(quality_failures),
                    "status": "failed" if errors or quality_failures else "passed",
                  },
                }

                with open("reports/ocr_report.json", "w", encoding="utf-8") as f:
                  json.dump(report, f, ensure_ascii=False, indent=2)

                if errors:
                  print("CATALOG INTEGRITY ERRORS:", file=sys.stderr)
                  for err in errors:
                    print(f"  - {err}", file=sys.stderr)

                if quality_failures:
                  print("OCR QUALITY FAILURES:", file=sys.stderr)
                  for err in quality_failures:
                    print(f"  - {err}", file=sys.stderr)

                if errors or quality_failures:
                  print("Validation failed. See reports/ocr_report.json for details.", file=sys.stderr)
                  sys.exit(1)

                print("Catalog and OCR validation passed.")
                PYEOF

              - name: Upload OCR quality report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: ocr-quality-report
                path: reports/ocr_report.json
                if-no-files-found: warn

      # ── 4. Flutter Web build ─────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter build web --base-href /intelligent-pwa-library/ --release

      # ── 5. Assemble deployment artefact ─────────────────────────────────────
      - name: Assemble dist/
        run: |
          mkdir -p dist
          # Flutter web output
          cp -r build/web/. dist/
          # JSON indices (may have been updated by OCR step)
          cp -r data dist/data
          # PDFs (publicly served)
          cp -r raw_assets dist/raw_assets
          # Disable Jekyll so GitHub Pages serves Flutter's _flutter.js and other
          # underscore-prefixed files without silently dropping them
          touch dist/.nojekyll

      # ── 6. Upload and deploy to GitHub Pages ───────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
